<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Calendar — Primaxs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --brand: #b3202a;
    --brand-dark: #8c1922;
    --brand-tint: #fbe9ea;
    --ink: #1c1b1f;
    --ink-muted: #6b6a70;
    --surface: #ffffff;
    --page: #f4f3f6;
    --border: #e3e2e6;
    --radius-md: 8px;
    --radius-lg: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--page);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.4;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
  }
  header .wrap {
    max-width: 1080px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    color: var(--ink);
  }
  header .link-back {
    color: var(--brand);
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
  }
  header .link-back:hover { text-decoration: underline; }

  main {
    max-width: 1080px;
    margin: 24px auto;
    padding: 0 24px 60px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-nav h2 { margin: 0; font-size: 18px; }
  .cal-nav .month-btns { display: flex; gap: 6px; }
  .cal-nav button {
    background: var(--surface);
    border: 1.5px solid var(--border);
    color: var(--ink);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  .cal-nav button:hover { border-color: var(--brand); color: var(--brand); }
  .cal-nav .today-btn {
    width: auto;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow {
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 4px 0;
  }
  .cal-day {
    min-height: 92px;
    background: #fafafb;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    cursor: default;
    position: relative;
    transition: transform 0.05s, border-color 0.1s;
  }
  .cal-day.other-month { opacity: 0.4; }
  .cal-day.has-data { cursor: pointer; background: var(--surface); }
  .cal-day.has-data:hover {
    border-color: var(--brand);
    transform: translateY(-1px);
  }
  .cal-day.today {
    border-color: var(--brand);
    background: var(--brand-tint);
  }
  .cal-day.selected {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-tint);
  }
  .cal-day .day-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: auto;
  }
  .cal-day .date-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .cal-day.other-month .date-num { color: var(--ink-muted); }
  .cal-day .items-count {
    background: var(--brand);
    color: white;
    padding: 1px 7px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    min-width: 22px;
    text-align: center;
    line-height: 1.5;
  }
  .cal-day .items-count.zero { display: none; }
  .cal-day .day-stats {
    font-size: 10.5px;
    color: var(--ink-muted);
    line-height: 1.35;
    margin-top: 4px;
  }
  .cal-day .day-stats .items-line { color: var(--ink); }
  .cal-day .day-stats .price-line {
    color: var(--brand);
    font-weight: 700;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
  }

  #detail {
    display: none;
  }
  #detail.open { display: block; }

  .detail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .detail-head h2 { margin: 0; font-size: 18px; }
  .detail-head .totals {
    font-size: 13px;
    color: var(--ink-muted);
  }
  .detail-head .totals strong {
    color: var(--ink);
    font-size: 15px;
    font-weight: 700;
    margin-left: 6px;
  }

  .quote-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-bottom: 12px;
    background: #fbfbfc;
  }
  .quote-card:last-child { margin-bottom: 0; }
  .quote-card .qc-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .quote-card .qc-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--brand);
    margin-bottom: 3px;
  }
  .quote-card .qc-serial {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .qc-doctype {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 4px;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    vertical-align: middle;
  }
  .qc-doctype.pdf  { background: #fde8e8; color: #b53131; }
  .qc-doctype.docx { background: #e0eafc; color: #1e4bb8; }

  /* Confirm button + modal (added for /purchases/ flow) */
  .qc-confirm-btn {
    background: #2b7a3b;
    color: #fff;
    border: none;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
  }
  .qc-confirm-btn:hover { background: #1f5c2c; }
  .qc-confirm-btn[disabled] { opacity: 0.6; cursor: default; }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center; z-index: 999;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border-radius: 12px;
    padding: 22px;
    min-width: 320px; max-width: 90vw;
    box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  }
  .modal-box h3 { margin: 0 0 6px; font-size: 17px; }
  .modal-box .subject { font-size: 12px; color: var(--ink-muted); margin-bottom: 14px; }
  .modal-box label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; }
  .modal-box input[type=date],
  .modal-box input[type=number] {
    padding: 8px 10px;
    border: 1.5px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 14px;
  }
  .modal-box .wd-row {
    display: flex; gap: 12px; align-items: center; margin-bottom: 8px;
  }
  .modal-box .wd-row .wd-cell { display: flex; align-items: center; gap: 6px; }
  .modal-box .wd-row input[type=number] { width: 72px; text-align: right; }
  .modal-box .deadline-preview {
    margin-bottom: 16px; font-size: 12px; color: var(--ink-muted);
  }
  .modal-box .deadline-preview b { color: var(--ink); font-weight: 600; }
  .modal-box .row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-box button {
    padding: 8px 14px; border-radius: 6px; font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  }
  .modal-box .btn-cancel { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); }
  .modal-box .btn-save   { background: #2b7a3b; color: white; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .quote-card .qc-customer {
    font-weight: 700;
    font-size: 14px;
  }
  .quote-card .qc-total {
    font-weight: 700;
    color: var(--brand);
    font-size: 15px;
  }
  .quote-card table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 6px;
  }
  .quote-card th, .quote-card td {
    text-align: left;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
  }
  .quote-card th {
    font-weight: 600;
    color: var(--ink-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .quote-card td.num,
  .quote-card th.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .quote-card tr:last-child td { border-bottom: none; }
  .quote-card .delivery-row td {
    font-style: italic;
    color: var(--ink-muted);
  }

  .empty {
    text-align: center;
    color: var(--ink-muted);
    padding: 40px 20px;
    font-style: italic;
  }
  .error {
    color: var(--brand-dark);
    background: var(--brand-tint);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  .month-summary {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .month-summary strong {
    color: var(--ink);
    font-weight: 700;
    margin-left: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Sales Calendar</h1>
    <div style="display:flex; gap:14px; flex-wrap:wrap;">
      <a href="purchases.html" class="link-back">Purchases &rarr;</a>
      <a href="index.html" class="link-back">&larr; Back to Quotation Builder</a>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="cal-nav">
      <div class="month-btns">
        <button id="prevBtn" title="Previous month">&lsaquo;</button>
        <button id="todayBtn" class="today-btn" title="Jump to today">Today</button>
        <button id="nextBtn" title="Next month">&rsaquo;</button>
      </div>
      <h2 id="monthLabel">—</h2>
      <div style="min-width:120px;"></div>
    </div>
    <div class="month-summary" id="monthSummary"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="calStatus" style="margin-top:12px; font-size:12px; color:var(--ink-muted);"></div>
  </section>

  <section class="panel" id="detail">
    <div class="detail-head">
      <h2 id="detailDate">—</h2>
      <div class="totals">
        Items sold:<strong id="detailItems">0</strong>&nbsp;&nbsp;·&nbsp;&nbsp;
        Day total:<strong id="detailTotal">RM 0.00</strong>
      </div>
    </div>
    <div id="detailList"></div>
  </section>
</main>

<!-- Confirm-purchase modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <h3>Confirm as purchase</h3>
    <div class="subject" id="confirmSubject">—</div>
    <label>Deadline to complete (from today)</label>
    <div class="wd-row">
      <div class="wd-cell"><input type="number" min="0" step="1" id="confirmWeeksInput" value="6"><span>weeks</span></div>
      <div class="wd-cell"><input type="number" min="0" step="1" id="confirmDaysInput"  value="0"><span>days</span></div>
    </div>
    <div class="deadline-preview" id="confirmDeadlinePreview">&rarr; Deadline: <b>—</b></div>
    <div class="row">
      <button class="btn-cancel" id="confirmCancelBtn">Cancel</button>
      <button class="btn-save" id="confirmSaveBtn">Save purchase</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://uwqmswitxgorowsxkqba.supabase.co";
const SUPABASE_KEY = "sb_publishable_WxNo1KNeE2_regh-_fJYdg_m9phJvN9";
const SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const el = {
  monthLabel: document.getElementById("monthLabel"),
  monthSummary: document.getElementById("monthSummary"),
  calGrid: document.getElementById("calGrid"),
  calStatus: document.getElementById("calStatus"),
  prevBtn: document.getElementById("prevBtn"),
  nextBtn: document.getElementById("nextBtn"),
  todayBtn: document.getElementById("todayBtn"),
  detail: document.getElementById("detail"),
  detailDate: document.getElementById("detailDate"),
  detailItems: document.getElementById("detailItems"),
  detailTotal: document.getElementById("detailTotal"),
  detailList: document.getElementById("detailList"),
};

// State: which month is on screen, and which day (if any) is expanded below.
let viewYear;
let viewMonth;  // 0-based, JS convention
let selectedDate = null; // "YYYY-MM-DD"
let currentMonthRows = []; // fetched quotation rows for the visible month
let currentByDate = {};    // date -> { items, total, rows } for instant click

const MONTHS = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function money(n) {
  return Number(n || 0).toLocaleString("en-US",
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Format a JS Date as YYYY-MM-DD in the operator's LOCAL time (matches how
// index.html tags quote_date when saving, so day-bucketing lines up).
function ymd(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function escapeHtml(s) {
  return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function loadMonth() {
  const first = new Date(viewYear, viewMonth, 1);
  const last  = new Date(viewYear, viewMonth + 1, 0);
  const fromDate = ymd(first);
  const toDate   = ymd(last);

  el.monthLabel.textContent = MONTHS[viewMonth] + " " + viewYear;
  el.calStatus.textContent = "Loading…";
  el.monthSummary.innerHTML = "";
  currentMonthRows = [];

  const { data, error } = await SB
    .from("quotations")
    .select("id, serial, quote_date, customer_name, customer_attn, items, item_count, delivery_desc, delivery_price, grand_total, created_at, doc_type")
    .gte("quote_date", fromDate)
    .lte("quote_date", toDate)
    .order("created_at", { ascending: true });

  if (error) {
    el.calStatus.innerHTML = '<div class="error">Could not load sales data: '
      + escapeHtml(error.message) + '</div>';
    renderCalendar({});
    return;
  }

  currentMonthRows = data || [];
  currentByDate = {};
  let monthItems = 0;
  let monthTotal = 0;
  for (const r of currentMonthRows) {
    (currentByDate[r.quote_date] ||= { items: 0, total: 0, rows: [] });
    currentByDate[r.quote_date].items += Number(r.item_count) || 0;
    currentByDate[r.quote_date].total += Number(r.grand_total) || 0;
    currentByDate[r.quote_date].rows.push(r);
    monthItems += Number(r.item_count) || 0;
    monthTotal += Number(r.grand_total) || 0;
  }

  el.calStatus.textContent = currentMonthRows.length + " quotations this month";
  el.monthSummary.innerHTML =
    "Month total items:<strong>" + monthItems + "</strong>" +
    "Month total sales:<strong>RM " + money(monthTotal) + "</strong>" +
    "Quotations generated:<strong>" + currentMonthRows.length + "</strong>";

  renderCalendar();

  // If a day was previously selected but now belongs to a different month,
  // drop the detail panel to avoid a stale view.
  if (selectedDate) {
    const s = new Date(selectedDate + "T00:00");
    if (s.getFullYear() !== viewYear || s.getMonth() !== viewMonth) {
      selectedDate = null;
      el.detail.classList.remove("open");
    } else {
      renderDetail(selectedDate, currentByDate[selectedDate]);
    }
  }
}

function renderCalendar() {
  const first = new Date(viewYear, viewMonth, 1);
  const leadingBlanks = first.getDay(); // 0 = Sunday
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const totalCells = Math.ceil((leadingBlanks + daysInMonth) / 7) * 7;
  const todayStr = ymd(new Date());

  let html = "";
  for (const dow of DOW) html += '<div class="cal-dow">' + dow + '</div>';

  for (let i = 0; i < totalCells; i++) {
    const dayOfMonth = i - leadingBlanks + 1;
    const inMonth = dayOfMonth >= 1 && dayOfMonth <= daysInMonth;
    let dayLabel, cellDateStr = "";
    if (inMonth) {
      cellDateStr = ymd(new Date(viewYear, viewMonth, dayOfMonth));
      dayLabel = String(dayOfMonth);
    } else {
      dayLabel = String(new Date(viewYear, viewMonth, dayOfMonth).getDate());
    }

    const data = inMonth ? currentByDate[cellDateStr] : null;
    const classes = ["cal-day"];
    if (!inMonth) classes.push("other-month");
    if (inMonth && cellDateStr === todayStr) classes.push("today");
    if (inMonth && cellDateStr === selectedDate) classes.push("selected");
    if (data && data.items > 0) classes.push("has-data");

    const badge = data && data.items > 0
      ? '<span class="items-count">' + data.rows.length + '</span>'
      : '<span class="items-count zero"></span>';

    const stats = data && data.items > 0
      ? '<div class="day-stats">' +
          '<div class="items-line">' + data.items + ' ' + (data.items === 1 ? 'item' : 'items') + '</div>' +
          '<div class="price-line">RM ' + money(data.total) + '</div>' +
        '</div>'
      : "";

    html += '<div class="' + classes.join(" ") + '"'
      + (data && data.items > 0 ? ' data-date="' + cellDateStr + '"' : "")
      + '>'
      + '<div class="day-top">'
      +   '<span class="date-num">' + dayLabel + '</span>'
      +   badge
      + '</div>'
      + stats
      + '</div>';
  }
  el.calGrid.innerHTML = html;
}

function renderDetail(dateStr, agg) {
  el.detail.classList.add("open");
  const d = new Date(dateStr + "T00:00");
  el.detailDate.textContent = d.toLocaleDateString("en-GB", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  const rows = agg ? agg.rows : [];
  el.detailItems.textContent = agg ? agg.items : 0;
  el.detailTotal.textContent = "RM " + money(agg ? agg.total : 0);

  if (rows.length === 0) {
    el.detailList.innerHTML = '<div class="empty">No quotations for this day.</div>';
    return;
  }

  const cards = rows.map((r, idx) => {
    const items = Array.isArray(r.items) ? r.items : [];
    const rowsHtml = items.map((it) =>
      '<tr>' +
        '<td>' + escapeHtml(it.name || it.sku) + '</td>' +
        '<td class="num">' + escapeHtml(it.qty) + '</td>' +
        '<td class="num">' + money(it.unit_myr || 0) + '</td>' +
        '<td class="num">' + money(it.total_myr || 0) + '</td>' +
      '</tr>'
    ).join("");
    const deliveryRow = (r.delivery_price != null && Number(r.delivery_price) > 0)
      ? '<tr class="delivery-row">' +
          '<td>Delivery fee' + (r.delivery_desc ? ' — ' + escapeHtml(r.delivery_desc) : "") + '</td>' +
          '<td class="num"></td>' +
          '<td class="num"></td>' +
          '<td class="num">' + money(r.delivery_price) + '</td>' +
        '</tr>'
      : "";
    const attn = r.customer_attn ? ' — Attn: ' + escapeHtml(r.customer_attn) : "";
    return (
      '<div class="quote-card">' +
        '<div class="qc-head">' +
          '<div>' +
            '<div class="qc-label">Quotation ' + (idx + 1) + '</div>' +
            '<div class="qc-customer">' + escapeHtml(r.customer_name || "(no customer name)") + attn + '</div>' +
            '<div class="qc-serial">Quote No. ' + escapeHtml(r.serial) +
              (r.doc_type === "docx"
                ? '<span class="qc-doctype docx">DOCX</span>'
                : '<span class="qc-doctype pdf">PDF</span>') +
            '</div>' +
          '</div>' +
          '<div style="text-align:right;">' +
            '<div class="qc-total">RM ' + money(r.grand_total) + '</div>' +
            '<button class="qc-confirm-btn" data-confirm-id="' + escapeHtml(r.id) + '">Confirm purchase</button>' +
          '</div>' +
        '</div>' +
        '<table>' +
          '<thead><tr>' +
            '<th>Product</th>' +
            '<th class="num">Qty</th>' +
            '<th class="num">Unit (RM)</th>' +
            '<th class="num">Line total (RM)</th>' +
          '</tr></thead>' +
          '<tbody>' + rowsHtml + deliveryRow + '</tbody>' +
        '</table>' +
      '</div>'
    );
  }).join("");

  el.detailList.innerHTML = cards;
}

// Click on a day cell -> instantly render its detail from the cached month
// data (no Supabase re-fetch, no perceptible delay), then scroll it into
// view so it's obviously visible on smaller screens.
el.calGrid.addEventListener("click", (e) => {
  const cell = e.target.closest(".cal-day.has-data");
  if (!cell) return;
  const date = cell.dataset.date;
  if (!date) return;

  if (selectedDate === date) {
    // Second click on the same day closes the detail panel.
    selectedDate = null;
    el.detail.classList.remove("open");
    renderCalendar();
    return;
  }

  selectedDate = date;
  renderCalendar();
  renderDetail(date, currentByDate[date]);
  // Bring the panel into view (offset a bit so the day itself stays visible).
  setTimeout(() => {
    el.detail.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 30);
});

el.prevBtn.addEventListener("click", () => {
  viewMonth -= 1;
  if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
  loadMonth();
});
el.nextBtn.addEventListener("click", () => {
  viewMonth += 1;
  if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
  loadMonth();
});
el.todayBtn.addEventListener("click", () => {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  selectedDate = ymd(now);
  loadMonth();
});

// Boot on today's month.
(function init() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth();
  loadMonth();
})();

// ============================================================================
// Confirm-purchase flow: click the green "Confirm purchase" button on any
// quote card -> modal asks for a deadline -> insert into public.purchases.
// ============================================================================
const confirmEl = {
  modal:   document.getElementById("confirmModal"),
  subject: document.getElementById("confirmSubject"),
  weeks:   document.getElementById("confirmWeeksInput"),
  days:    document.getElementById("confirmDaysInput"),
  preview: document.getElementById("confirmDeadlinePreview"),
  cancel:  document.getElementById("confirmCancelBtn"),
  save:    document.getElementById("confirmSaveBtn"),
  toast:   document.getElementById("toast"),
};

// Compute (today + weeks*7 + days) as YYYY-MM-DD in local time.
function deadlineFromWeeksDays(weeks, days) {
  const total = (Number(weeks) || 0) * 7 + (Number(days) || 0);
  if (total < 0) return null;
  const d = new Date();
  d.setDate(d.getDate() + total);
  return ymd(d);
}
function updateConfirmPreview() {
  const iso = deadlineFromWeeksDays(confirmEl.weeks.value, confirmEl.days.value);
  if (!iso) { confirmEl.preview.innerHTML = "&rarr; Deadline: <b>&mdash;</b>"; return; }
  const pretty = new Date(iso + "T00:00")
    .toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  confirmEl.preview.innerHTML = "&rarr; Deadline: <b>" + pretty + "</b>";
}
confirmEl.weeks.addEventListener("input", updateConfirmPreview);
confirmEl.days.addEventListener("input",  updateConfirmPreview);
let confirmingRowId = null;

function toast(msg) {
  confirmEl.toast.textContent = msg;
  confirmEl.toast.classList.add("show");
  setTimeout(() => confirmEl.toast.classList.remove("show"), 2400);
}

// Daily-reset serial for confirmed purchases: PO-YYMMDD-NNN. Reads the max
// existing serial for TODAY from Supabase and increments; falls back to 001.
async function nextPurchaseSerial() {
  const now = new Date();
  const yymmdd = String(now.getFullYear()).slice(-2) +
    String(now.getMonth() + 1).padStart(2, "0") +
    String(now.getDate()).padStart(2, "0");
  const prefix = "PO-" + yymmdd + "-";
  const { data, error } = await SB
    .from("purchases")
    .select("serial")
    .like("serial", prefix + "%")
    .order("serial", { ascending: false })
    .limit(1);
  let n = 1;
  if (!error && data && data.length > 0) {
    const m = /-(\d+)$/.exec(data[0].serial);
    if (m) n = parseInt(m[1], 10) + 1;
  }
  return prefix + String(n).padStart(3, "0");
}

// Open the modal, pre-fill deadline = today + 42d (a sensible 6-week default
// the operator can override before saving).
document.body.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-confirm-id]");
  if (!btn) return;
  confirmingRowId = btn.dataset.confirmId;
  const row = currentMonthRows.find((r) => String(r.id) === String(confirmingRowId));
  if (!row) { alert("Could not find that quotation row."); return; }
  confirmEl.subject.textContent = (row.customer_name || "(no name)") + " — " + row.serial;
  // Sensible default: 6 weeks, 0 days from today (matches "4 to 6 Weeks"
  // terms on the quotation).
  confirmEl.weeks.value = 6;
  confirmEl.days.value = 0;
  updateConfirmPreview();
  confirmEl.modal.classList.add("open");
  setTimeout(() => confirmEl.weeks.focus(), 50);
});

confirmEl.cancel.addEventListener("click", () => confirmEl.modal.classList.remove("open"));
confirmEl.modal.addEventListener("click", (e) => {
  if (e.target === confirmEl.modal) confirmEl.modal.classList.remove("open");
});

confirmEl.save.addEventListener("click", async () => {
  const deadline = deadlineFromWeeksDays(confirmEl.weeks.value, confirmEl.days.value);
  if (!deadline) { alert("Please enter weeks + days for the deadline."); return; }
  const row = currentMonthRows.find((r) => String(r.id) === String(confirmingRowId));
  if (!row) return;

  confirmEl.save.disabled = true;
  const originalLabel = confirmEl.save.textContent;
  confirmEl.save.textContent = "Saving…";
  try {
    const serial = await nextPurchaseSerial();
    const { error } = await SB.from("purchases").insert({
      serial,
      confirm_date: ymd(new Date()),
      deadline,
      customer_name: row.customer_name || "",
      customer_attn: row.customer_attn || null,
      items: row.items,
      item_count: row.item_count,
      delivery_desc: row.delivery_desc || null,
      delivery_price: row.delivery_price,
      grand_total: row.grand_total,
      source: "quotation",
      quotation_serial: row.serial,
    });
    if (error) throw error;
    confirmEl.modal.classList.remove("open");
    toast("Purchase " + serial + " confirmed.");
  } catch (err) {
    alert("Could not save the purchase: " + (err.message || err));
  } finally {
    confirmEl.save.disabled = false;
    confirmEl.save.textContent = originalLabel;
  }
});
</script>
